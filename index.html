<!DOCTYPE html>
<html>
<head>
    <title>Hangman</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom, #2c2c2c, #1a1a1a);
         background-size: cover;
         color: white;
        }
    

.hangman-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("your-texture-image.png"); 
    opacity: 0.3; 
}

.illustration {
    filter: drop-shadow(5px 5px 10px grey);
}
        div, h1, span, p {
            font: 'Times New Roman';
        }
        h1 {
            text-align: center;
        }
        .illustration {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        .stick {
            position: relative;
            width: 300px;
            height: 350px;
        }
        .platform, .person {
            position: absolute;
        }
        .platform {
            width: 200px;
            height: 350px;
        }
        .platform div, .person div {
            background-color: #fcc0c5;
            position: absolute;
        }
        .base {
            width: 150px;
            height: 5px;
            bottom: 0%;
            left: -15%;
        }
        .pole {
            width: 5px;
            height: 350px;
        }
        .overhang {
            width: 200px;
            height: 5px;
        }
        .extension {
            width: 5px;
            height: 50px;
            right: 0%;
        }
        .person {
            width: 150px;
            width: 200px;
            height: 5px ;
            }

            .extension {
            width: 5px;
            height: 50px;
            right: 0%;
            }

            .person {
            width: 150px;
            height: 250px;
            top: 17%;
            right: -9.2%;
            }

            .head {
            width: 37.5px;
            height: 37.5px;
            border-radius: 100%;
            background-color: transparent ;
            left: 0.2;
            }

            .arm, .foot {
            width: 2.5px;
            height: 62.5px;
            
            }

            .arm-1, .foot-1 {
            transform: rotate(45deg);
            top: 20%;
            left: -1.3%;
            }

            .arm-2, .foot-2 {
            transform: rotate(-45deg);
            top: 20%;
            left: 28%;
            }

            .torso {
            width: 2.5px;
            height: 87.5px;
            top: 17%;
            left: 13.5%;
            }

            .foot-1, .foot-2 {
            top: 48%;
            }

            .word, .score {
            display: flex;
            justify-content: center;
            margin-top: 50px;
            gap: 5px;
            color: #fcc0c5;
            }

            .letter {
            width: 50px;
            font-size: 25px;
            }

            .score {
            font-size: 25px;
            }

            .answer {
            display: flex;
            justify-content: center;
            margin-top: 50px;
            }

            button {
            color: black;
            width: 100px;
            height: 50px;
            
            font-style: Georgia, serif;
            font-weight: bold;
            transition: background-color 0.3s ease;
            }

            button:hover {
            background-color: #fcc0c5;
            color: black;
            }

            .head, .arm, .torso, .foot {
            display: none;
            }
        </style>
        <script src="hangman.js"></script>
    </head>
    <body onload="initGame()">
        <div class="container">
            <div class="main-box"></div>
            <div class="bottom-box"></div>
            <div class="button"></div>
        </div>
        <h1>Hangman</h1>

        <div class="illustration">
            <div class="stick">
                <div class="platform">
                    <div class="base"></div>
                    <div class="pole"></div>
                    <div class="overhang"></div>
                    <div class="extension"></div>
                </div>
                <div class="person">
                    <div id="head" class="head"></div>
                    <div id="arm-1" class="arm-1 arm"></div>
                    <div id="arm-2" class="arm-2 arm"></div>
                    <div id="torso" class="torso"></div>
                    <div id="foot-1" class="foot-1 foot"></div>
                    <div id="foot-2" class="foot-2 foot"></div>
                </div>
            </div>
        </div>

        <div class="word">
            <div class="letter" id="s-0">_</div>
            <div class="letter" id="s-1">_</div>
            <div class="letter" id="s-2">_</div>
            <div class="letter" id="s-3">_</div>
            <div class="letter" id="s-4">_</div>
        </div>
        <div class="score">
            <div>Lives: </div>
            <div id="lives"></div>
        </div>

        <div class="answer">
            <button onclick="guessLetter()">Enter a letter</button>
        </div>
    </body>
</html>
