<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .word { 
            font-size: 24px;
            letter-spacing: 10px; 
            margin: 20px;
        }
        .keyboard { 
            display: inline-block; 
            margin-top: 20px; 
        }
        .row { 
            display: flex; 
            justify-content: center; 
        }
        .row button { 
            margin: 5px; 
            padding: 10px; 
            font-size: 16px; 
            width: 40px; 
        }
        .hangman { 
            font-size: 20px; 
            color: red; 
        }
        canvas { 
            margin-top: 20px; 
            width: 400px; 
            height: 400px; 
        }
    </style>
</head>
<body>
    <h1>Hangman Game</h1>
    <canvas id="hangmanCanvas" width="400" height="400"></canvas>
    <div id="hangman" class="hangman">Attempts Left: 6</div>
    <div id="word" class="word"></div>
    <div class="keyboard"></div>
    <script>
        const words = [
            "crisp", "blunt", "frost", "champ", "squad", "vapid", "globe", "index", "jumpy", "knurl", "proud", "dwarf", "brick", "tulip", "zesty", "fjord", "mucky", "nymph", "quilt", "brawl", "cider", "flint", "ghost", "joked", "lyric", "mince", "nifty", "opera", "pique", "quirk", "shear", "trick", "vocal", "waltz", "xylem", "yacht", "zebra", "canto", "dingo", "enjoy", "fable", "gland", "heist", "inbox", "lemon", "molar", "noble", "ocean", "boney", "scamp"
        ];

        const selectedWord = words[Math.floor(Math.random() * words.length)];
        let displayWord = "_".repeat(selectedWord.length).split("");
        let attempts = 6;

        document.getElementById("word").innerText = displayWord.join(" ");

        function createKeyboard() {
            const keyboard = document.querySelector(".keyboard");
            const layout = [
                "qwertyuiop",
                "asdfghjkl",
                "zxcvbnm"
            ];

            layout.forEach(row => {
                let rowDiv = document.createElement("div");
                rowDiv.classList.add("row");
                row.split("").forEach(letter => {
                    let btn = document.createElement("button");
                    btn.innerText = letter;
                    btn.onclick = () => guessLetter(letter, btn);
                    rowDiv.appendChild(btn);
                });
                keyboard.appendChild(rowDiv);
            });
        }

        function guessLetter(letter, button) {
            button.disabled = true;
            let found = false;
            
            for (let i = 0; i < selectedWord.length; i++) {
                if (selectedWord[i] === letter) {
                    displayWord[i] = letter;
                    found = true;
                }
            }
            
            document.getElementById("word").innerText = displayWord.join(" ");

            if (!found) {
                attempts--;
                document.getElementById("hangman").innerText = "Attempts Left: " + attempts;
                drawHangman(attempts);
                if (attempts === 0) alert("Game Over! The word was " + selectedWord);
            } else if (!displayWord.includes("_")) {
                alert("Congratulations! You guessed the word: " + selectedWord);
            }
        }

        function drawHangman(attempts) {
            const canvas = document.getElementById("hangmanCanvas");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (attempts <= 5) { ctx.beginPath(); ctx.moveTo(20, 380); ctx.lineTo(380, 380); ctx.stroke(); }
            if (attempts <= 4) { ctx.beginPath(); ctx.moveTo(100, 380); ctx.lineTo(100, 20); ctx.lineTo(300, 20); ctx.lineTo(300, 60); ctx.stroke(); }
            if (attempts <= 3) { ctx.beginPath(); ctx.arc(300, 100, 40, 0, Math.PI * 2); ctx.stroke(); }
            if (attempts <= 2) { ctx.beginPath(); ctx.moveTo(300, 140); ctx.lineTo(300, 260); ctx.stroke(); }
            if (attempts <= 1) { ctx.beginPath(); ctx.moveTo(300, 180); ctx.lineTo(240, 220); ctx.moveTo(300, 180); ctx.lineTo(360, 220); ctx.stroke(); }
            if (attempts === 0) { ctx.beginPath(); ctx.moveTo(300, 260); ctx.lineTo(240, 320); ctx.moveTo(300, 260); ctx.lineTo(360, 320); ctx.stroke(); }
        }

        createKeyboard();
    </script>
</body>
</html>
